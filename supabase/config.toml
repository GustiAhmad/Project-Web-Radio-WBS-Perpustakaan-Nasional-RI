# Konfigurasi Edge Function untuk deploy lewat Supabase CLI.
# Webhook database memanggil fungsi ini tanpa JWT pengguna, jadi verify_jwt dimatikan.
# Pemanggil tetap divalidasi lewat kunci proyek pada header apikey di dalam fungsi.

[functions.kirim-notifikasi-laporan]
verify_jwt = false

# Panel admin memanggil fungsi ini dengan JWT pengguna, jadi verify_jwt aktif.
# Peran pemanggil tetap divalidasi ulang di dalam fungsi.
[functions.kelola-pengguna]
verify_jwt = true
