name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Ambil kode sumber
        uses: actions/checkout@v7.0.1

      - name: 2. Pasang Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: 3. Pasang dependensi
        run: npm ci

      - name: 4. Periksa tipe TypeScript
        run: npm run type-check

      - name: 5. Bangun aset produksi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_ICECAST_STREAM_URL: ${{ secrets.VITE_ICECAST_STREAM_URL }}
        run: npm run build

      - name: 6. Unggah artefak Pages
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 7. Terbitkan ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
